name: mibu
description: "mibu — catat duit, ada kantongnya."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  hugeicons: ^1.2.0
  intl: any
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.16

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-400.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-500.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-600.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-700.ttf
          weight: 700
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-900.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon_ios.png
  remove_alpha_ios: true
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: assets/branding/icon_fg.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/icon_mono.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#111111"
  image: assets/branding/splash_ios.png
  android_12:
    color: "#111111"
    image: assets/branding/splash_mark.png
